        // IndexedDB para guardar ROMs na memória local do navegador
        function openRomDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('sn16_rom_db', 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('roms')) {
                        db.createObjectStore('roms');
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e);
            });
        }

        async function saveRomToDB(name, blob) {
            try {
                const db = await openRomDB();
                const tx = db.transaction('roms', 'readwrite');
                tx.objectStore('roms').put(blob, name);
            } catch(e) {}
        }

        async function getRomFromDB(name) {
            try {
                const db = await openRomDB();
                return new Promise((resolve) => {
                    const tx = db.transaction('roms', 'readonly');
                    const req = tx.objectStore('roms').get(name);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch(e) {
                return null;
            }
        }

        async function addRecentGame(fileName, fileBlob) {
            let recents = JSON.parse(localStorage.getItem('sn16_recent_games') || '[]');
            recents = recents.filter(item => item.name !== fileName);
            recents.unshift({ name: fileName, icon: 'default-icon.png' });
            if (recents.length > 5) recents.pop();
            localStorage.setItem('sn16_recent_games', JSON.stringify(recents));
            if (fileBlob) await saveRomToDB(fileName, fileBlob);
            renderRecentGames();
        }

        async function launchFromRecent(fileName) {
            const blob = await getRomFromDB(fileName);
            if (!blob) {
                alert("ROM não encontrada na memória! Escolha o ficheiro novamente.");
                return;
            }
            const file = new File([blob], fileName);
            startEmulatorWithFile(file);
        }

        function updateLanguage() {
            const currentLang = languages[langIndex];
            const t = i18n[currentLang];
            txtSubtitle.innerHTML = t.subtitle;
            runRomBtn.innerText = t.runRom;
            fullScreenBtn.innerText = t.fullscreen;
            txtRecentTitle.innerText = t.recentTitle;
            if (!selectedFile) statusDiv.innerText = t.waiting;
            document.getElementById('btnResume').innerText = t.resume;
            document.getElementById('btnSaveStateMenu').innerText = t.saveState;
            document.getElementById('btnLoadStateMenu').innerText = t.loadState;
            document.getElementById('btnSaveAndQuit').innerText = t.saveAndQuit;
            document.getElementById('btnQuit').innerText = t.quit;
            document.getElementById('stateMenuTitle').innerText = t.selectSlot;
            document.getElementById('btnCloseStateMenu').innerText = t.back;
            
            if (!isXLocked) toggleXBtn.innerText = t.toggleX;
            else toggleXBtn.innerText = t.locked;

            langToggleBtn.innerText = t.langLabel;
            btnLangIngame.innerText = "🌐 " + t.langLabel;
            renderRecentGames();
        }

        langToggleBtn.addEventListener('click', () => {
            langIndex = (langIndex + 1) % languages.length;
            updateLanguage();
        });
        btnLangIngame.addEventListener('click', () => {
            langIndex = (langIndex + 1) % languages.length;
            updateLanguage();
        });

        romInput.addEventListener('change', (event) => {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                statusDiv.innerHTML = `Ficheiro: ${selectedFile.name}`;
                runRomBtn.style.display = 'block';
            }
        });

        runRomBtn.addEventListener('click', () => {
            if (selectedFile) startEmulatorWithFile(selectedFile);
        });

        async function startEmulatorWithFile(fileObj) {
            const currentLang = languages[langIndex];
            const t = i18n[currentLang];
            const fileName = fileObj.name.toLowerCase();
            currentRomName = fileObj.name;
            let core = 'fceumm';

            if (fileName.endsWith('.sfc') || fileName.endsWith('.smc')) {
                core = 'snes9x';
            } else if (fileName.endsWith('.bin') || fileName.endsWith('.gen') || fileName.endsWith('.smd') || fileName.endsWith('.md')) {
                core = 'genesis_plus_gx';
            } else if (!fileName.endsWith('.nes')) {
                statusDiv.innerHTML = t.formatError;
                return;
            }

            statusDiv.innerHTML = t.loading;
            await addRecentGame(currentRomName, fileObj);

            try {
                if (nostalgistInstance) {
                    await nostalgistInstance.exit();
                    nostalgistInstance = null;
                }

                menuContainer.style.display = 'none';
                touchControls.style.display = 'flex';
                ingameTopBar.style.display = 'flex';

                nostalgistInstance = await Nostalgist.launch({
                    core: core,
                    rom: fileObj,
                    retroarchConfig: {
                        video_smooth: false,
                        video_threaded: true,
                        audio_sync: true,
                        audio_latency: 64,
                        fast_forward_ratio: 1.0
                    }
                });

                statusDiv.innerHTML = t.running;
            } catch (error) {
                alert("Erro ao iniciar: " + error.message);
                menuContainer.style.display = 'block';
                touchControls.style.display = 'none';
                ingameTopBar.style.display = 'none';
                statusDiv.innerHTML = t.formatError;
            }
        }

        function openSlotMenu(mode) {
            activeStateMode = mode;
            gameMenuOverlay.style.display = 'none';
            stateMenuOverlay.style.display = 'flex';
            slotContainer.innerHTML = '';
            const t = i18n[languages[langIndex]];

            for (let i = 1; i <= 4; i++) {
                const slotData = simpleSaves[i];
                const card = document.createElement('div');
                card.className = 'slot-card';
                
                const dateStr = slotData && slotData.date ? slotData.date : t.emptySlot;

                card.innerHTML = `
                    <div>
                        <div class="slot-title">Slot ${i}</div>
                        <div class="slot-date">${dateStr}</div>
                    </div>
                    <div style="font-size:12px; color:#ffcc00; font-weight:bold;">${mode === 'save' ? 'SALVAR' : 'CARREGAR'}</div>
                `;

                card.addEventListener('click', () => executeSlotAction(i));
                slotContainer.appendChild(card);
            }
        }

        async function executeSlotAction(slotNum) {
            if (!nostalgistInstance) return;
            stateMenuOverlay.style.display = 'none';
            const t = i18n[languages[langIndex]];

            if (activeStateMode === 'save') {
                showToast(t.saving);
                try {
                    const result = await nostalgistInstance.saveState();
                    const now = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    simpleSaves[slotNum] = {
                        state: result.state,
                        date: now
                    };

                    showToast(t.saved);
                    await nostalgistInstance.resume();
                } catch (e) {
                    showToast("Erro ao salvar!");
                    await nostalgistInstance.resume();
                }
            } else {
                if (!simpleSaves[slotNum] || !simpleSaves[slotNum].state) {
                    showToast(t.noSave);
                    gameMenuOverlay.style.display = 'flex';
                    return;
                }
                showToast(t.loadingSave);
                try {
                    await nostalgistInstance.loadState(simpleSaves[slotNum].state);
                    showToast(t.loadedSave);
                    gameMenuOverlay.style.display = 'flex';
                } catch (e) {
                    showToast("Erro ao carregar!");
                    gameMenuOverlay.style.display = 'flex';
                }
            }
        }

        document.getElementById('btnSaveStateMenu').addEventListener('click', () => openSlotMenu('save'));
        document.getElementById('btnLoadStateMenu').addEventListener('click', () => openSlotMenu('load'));
        document.getElementById('btnCloseStateMenu').addEventListener('click', () => {
            stateMenuOverlay.style.display = 'none';
            gameMenuOverlay.style.display = 'flex';
        });

        // Botão Segurar X
        toggleXBtn.addEventListener('click', async () => {
            if (!nostalgistInstance) return;
            const currentLang = languages[langIndex];
            const t = i18n[currentLang];
            isXLocked = !isXLocked;
            if (isXLocked) {
                toggleXBtn.classList.add('locked');
                toggleXBtn.innerText = t.locked;
                await nostalgistInstance.pressDown('x');
            } else {
                toggleXBtn.classList.remove('locked');
                toggleXBtn.innerText = t.toggleX;
                await nostalgistInstance.pressUp('x');
            }
        });

        inGameMenuBtn.addEventListener('click', async () => {
            if (gameMenuOverlay.style.display === 'flex') {
                gameMenuOverlay.style.display = 'none';
                if (nostalgistInstance) await nostalgistInstance.resume();
            } else {
                if (nostalgistInstance) await nostalgistInstance.pause();
                gameMenuOverlay.style.display = 'flex';
            }
        });

        document.getElementById('btnResume').addEventListener('click', async () => {
            gameMenuOverlay.style.display = 'none';
            if (nostalgistInstance) await nostalgistInstance.resume();
        });

        function showToast(text) {
            toastNotification.innerText = text;
            toastNotification.style.display = 'block';
            setTimeout(() => {
                toastNotification.style.display = 'none';
            }, 1800);
        }

        document.getElementById('btnSaveAndQuit').addEventListener('click', async () => {
            if (!nostalgistInstance) return;
            const currentLang = languages[langIndex];
            const t = i18n[currentLang];
            showToast(t.saving);
            try {
                const result = await nostalgistInstance.saveState();
                const now = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                simpleSaves[1] = { state: result.state, date: now };

                showToast(t.saved);
                gameMenuOverlay.style.display = 'none';
                await nostalgistInstance.exit();
                nostalgistInstance = null;
                touchControls.style.display = 'none';
                ingameTopBar.style.display = 'none';
                menuContainer.style.display = 'block';
                runRomBtn.style.display = 'none';
                romInput.value = '';
                isXLocked = false;
                toggleXBtn.classList.remove('locked');
                updateLanguage();
                statusDiv.innerHTML = t.waiting;
            } catch (e) {
                showToast("Erro!");
            }
        });

        document.getElementById('btnQuit').addEventListener('click', async () => {
            const currentLang = languages[langIndex];
            const t = i18n[currentLang];
            gameMenuOverlay.style.display = 'none';
            if (nostalgistInstance) {
                await nostalgistInstance.exit();
                nostalgistInstance = null;
            }
            touchControls.style.display = 'none';
            ingameTopBar.style.display = 'none';
            menuContainer.style.display = 'block';
            runRomBtn.style.display = 'none';
            romInput.value = '';
            isXLocked = false;
            toggleXBtn.classList.remove('locked');
            updateLanguage();
            statusDiv.innerHTML = t.waiting;
        });

        // MULTI-TOUCH SISTEMA COMPLETO (D-Pad, A/B/X/Y, Select, Start, Toggle X)
        const activePointers = new Map();
        const activeButtons = new Set();

        function updateEmulatedButtons(buttonsSet) {
            if (!nostalgistInstance) return;
            
            // Remove realce visual dos botões não tocados
            document.querySelectorAll('.pad-btn, .sys-btn').forEach(btn => {
                const action = btn.getAttribute('data-action');
                if (action && !buttonsSet.has(action)) {
                    btn.classList.remove('active-touch');
                }
            });

            activeButtons.forEach(btn => {
                if (!buttonsSet.has(btn)) {
                    nostalgistInstance.pressUp(btn);
                    activeButtons.delete(btn);
                }
            });

            buttonsSet.forEach(btn => {
                if (!activeButtons.has(btn)) {
                    nostalgistInstance.pressDown(btn);
                    activeButtons.add(btn);
                }
                // Adiciona efeito visual no toque do botão ativo
                const activeElem = document.querySelector(`[data-action="${btn}"]`);
                if (activeElem) activeElem.classList.add('active-touch');
            });
        }

        function handleTouchInputs(e) {
            if (touchControls.style.display === 'none') return;
            
            if (e.type === 'pointerup' || e.type === 'pointercancel' || e.type === 'pointerleave') {
                activePointers.delete(e.pointerId);
            } else {
                const elem = document.elementFromPoint(e.clientX, e.clientY);
                const btn = elem ? elem.closest('.pad-btn, .sys-btn') : null;
                if (btn && touchControls.contains(btn)) {
                    const action = btn.getAttribute('data-action');
                    if (action) activePointers.set(e.pointerId, action);
                } else {
                    activePointers.delete(e.pointerId);
                }
            }

            const currentPressed = new Set(activePointers.values());
            if (isXLocked) currentPressed.add('x');
            updateEmulatedButtons(currentPressed);
        }

        ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerleave'].forEach(eventType => {
            document.addEventListener(eventType, handleTouchInputs, { passive: false });
        });

        updateLanguage();
    </script>
</body>
</html>
